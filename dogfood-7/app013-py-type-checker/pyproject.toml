[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dogfood-pycheck"
version = "0.1.0"
description = "A gradual type checker for a deliberately bounded Python subset"
requires-python = ">=3.10"

[project.scripts]
pycheck = "pycheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-scratch"
