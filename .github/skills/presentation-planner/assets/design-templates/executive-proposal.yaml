id: executive-proposal
base_template: null
intent:
  - executive decision
  - investment approval
  - transformation roadmap
  - technical proposal
canvas:
  aspect_ratio: "16:9"
  width_in: 13.333
  height_in: 7.5
  safe_area_percent: 6
  grid_columns: 12
  max_content_blocks: 4
colors:
  background: "#FFFFFF"
  surface: "#F3F3F3"
  text_primary: "#1B1B1B"
  text_secondary: "#505050"
  accent: "#005A9E"
  accent_soft: "#E5F1FB"
  border_neutral: "#8A8886"
  positive: "#107C10"
  warning: "#8A5A00"
  critical: "#A4262C"
  brand_red: "#F25022"
  brand_green: "#7FBA00"
  brand_blue: "#00A4EF"
  brand_yellow: "#FFB900"
  chart_sequence:
    - "#005A9E"
    - "#F25022"
    - "#767676"
typography:
  heading_font: "Aptos Display"
  body_font: "Aptos"
  title_size_pt: 30
  section_title_size_pt: 26
  body_size_pt: 18
  caption_size_pt: 11
  title_weight: 700
  body_line_spacing: 1.15
spacing:
  outer_margin_percent: 6
  content_gap_percent: 2
  card_padding_percent: 2
components:
  cards:
    corner_radius: medium
    border: none
    shadow: subtle
  callouts:
    use_accent_bar: true
    maximum_per_slide: 1
  tables:
    header_fill: accent_soft
    header_text: text_primary
    zebra_rows: true
    maximum_rows: 7
  charts:
    style: direct-label
    gridlines: minimal
    direct_labels_required: true
    series_outline: background
    source_note_required: true
  diagrams:
    connector_style: orthogonal
    maximum_nodes: 7
slide_patterns:
  - title
  - executive-summary
  - problem-evidence
  - option-comparison
  - recommendation
  - roadmap
  - investment-and-value
  - risk-and-mitigation
  - decision-request
accessibility:
  minimum_body_size_pt: 16
  minimum_contrast_ratio: 4.5
  never_use_color_alone: true
  alt_text_required: true
constraints:
  - one primary message per slide
  - assertion title required
  - no more than one chart per slide
  - no decorative stock imagery without narrative value
  - Microsoft logo colors are not used for small text on white
  - brand_yellow uses a direct label and pattern or marker encoding
  - charts with more than three series add pattern or shape encoding
deviations: []
