name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'npm publish --dry-run'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provision isolated pytest
        run: |
          python3 -m venv "$RUNNER_TEMP/sdd-pytest"
          export PATH="$RUNNER_TEMP/sdd-pytest/bin:$PATH"
          python3 -m pip install pytest
          printf '%s\n' "$RUNNER_TEMP/sdd-pytest/bin" >> "$GITHUB_PATH"
          PYTHONNOUSERSITE=1 python3 -m pytest --version
      - name: Install R test toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq r-base-core
      - name: Run lean-sdd-tdd suite
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Publish
        run: npm publish --provenance --access public ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
