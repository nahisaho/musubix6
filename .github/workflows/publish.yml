name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'npm publish --dry-run'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv for GiNZA integration tests
        run: python3 -m pip install uv
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
      - uses: actions/setup-python@v5
        id: diagnostic-python
        with:
          python-version: '3.14'
          update-environment: false
      - name: Provision pinned diagnostic developer tools
        run: |
          "${{ steps.diagnostic-python.outputs.python-path }}" -m venv "$RUNNER_TEMP/sdd-diagnostics"
          "$RUNNER_TEMP/sdd-diagnostics/bin/python" -m pip install -r scripts/diagnostics-tools.txt
          printf 'MUSUBIX_DIAGNOSTICS_TEST_VENV=%s\n' "$RUNNER_TEMP/sdd-diagnostics" >> "$GITHUB_ENV"
      - name: Provision isolated pytest
        run: |
          python3 -m venv "$RUNNER_TEMP/sdd-pytest"
          export PATH="$RUNNER_TEMP/sdd-pytest/bin:$PATH"
          python3 -m pip install pytest
          printf '%s\n' "$RUNNER_TEMP/sdd-pytest/bin" >> "$GITHUB_PATH"
          PYTHONNOUSERSITE=1 python3 -m pytest --version
      - name: Install R test toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq r-base-core
      - name: Run lean-sdd-tdd suite
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Publish
        run: |
          set -euo pipefail
          npm pack --ignore-scripts
          artifact="musubix6-$(node -p "require('./package.json').version").tgz"
          if [ "$PUBLISH_DRY_RUN" != true ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) ;;
              *) echo "Publication requires an approved release tag" >&2; exit 1 ;;
            esac
            if [ "$GITHUB_REF_NAME" != "v$(node -p "require('./package.json').version")" ]; then
              echo "Release tag does not match package version" >&2
              exit 1
            fi
            git fetch --no-tags origin "$GITHUB_REF"
            if [ "$(git cat-file -t FETCH_HEAD)" != tag ]; then
              echo "Publication requires an annotated release tag" >&2
              exit 1
            fi
            if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$(git rev-parse HEAD)" ]; then
              echo "Release tag does not match the checked-out candidate" >&2
              exit 1
            fi
            expected="$(git cat-file tag FETCH_HEAD | node --input-type=module -e '
              import fs from "node:fs";
              const rows = fs.readFileSync(0, "utf8").split(/\r?\n/)
                .filter(line => line.startsWith("Approved-Package-SHA256:"));
              if (rows.length !== 1 || !/^Approved-Package-SHA256: [a-f0-9]{64}$/.test(rows[0])) {
                console.error("Exactly one approved package SHA-256 is required");
                process.exit(1);
              }
              console.log(rows[0].slice("Approved-Package-SHA256: ".length));
            ')"
            printf '%s  %s\n' "$expected" "$artifact" | sha256sum --check
          fi
          npm whoami --registry https://registry.npmjs.org/
          npm publish --provenance --access public "$artifact" ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
