name: Windows runner development controls

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-controls:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Probe native directory flush access without changing product policy
        shell: pwsh
        run: |
          @'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const root = fs.mkdtempSync(path.join(os.tmpdir(), 'ledger-flush-probe-'));
          console.log(JSON.stringify({ node: process.version, uv: process.versions.uv, platform: process.platform }));
          try {
            for (const mode of ['r', 'r+', 'rs+']) {
              let fd;
              let phase = 'open';
              try {
                fd = fs.openSync(root, mode);
                phase = 'flush';
                fs.fsyncSync(fd);
                console.log(JSON.stringify({ target: 'directory', mode, phase, ok: true }));
              } catch (error) {
                console.log(JSON.stringify({ target: 'directory', mode, phase, ok: false, code: error.code }));
              } finally {
                if (fd !== undefined) fs.closeSync(fd);
              }
            }
            const file = path.join(root, 'file-control');
            const fd = fs.openSync(file, 'wx');
            try {
              fs.writeFileSync(fd, 'valid file flush control\n');
              fs.fsyncSync(fd);
              console.log(JSON.stringify({ target: 'file', mode: 'wx', ok: true }));
            } finally { fs.closeSync(fd); }
            fs.unlinkSync(file);
          } finally { fs.rmdirSync(root); }
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Run source native controls and literal-argv admission regressions
        run: node --test --test-reporter=spec .github/skills/lean-sdd-tdd/scripts/windows-native.test.mjs .github/skills/lean-sdd-tdd/scripts/windows-runner.test.mjs
      - name: Copy skills to both hosts
        shell: pwsh
        run: |
          node bin/musubix6.mjs init "$env:RUNNER_TEMP/runner-installed" --host both
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run relocated native controls for both hosts
        shell: pwsh
        run: |
          foreach ($hostDirectory in @(".github", ".claude")) {
            $env:SDD_SCRIPT_UNDER_TEST = "$env:RUNNER_TEMP/runner-installed/$hostDirectory/skills/lean-sdd-tdd/scripts/sdd.mjs"
            node --test --test-reporter=spec .github/skills/lean-sdd-tdd/scripts/windows-native.test.mjs .github/skills/lean-sdd-tdd/scripts/windows-runner.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run lone standalone script controls
        shell: pwsh
        run: |
          New-Item -ItemType Directory "$env:RUNNER_TEMP/runner-standalone" | Out-Null
          Copy-Item ".github/skills/lean-sdd-tdd/scripts/sdd.mjs" "$env:RUNNER_TEMP/runner-standalone/sdd.mjs"
          $env:SDD_SCRIPT_UNDER_TEST = "$env:RUNNER_TEMP/runner-standalone/sdd.mjs"
          node --test --test-reporter=spec .github/skills/lean-sdd-tdd/scripts/windows-native.test.mjs .github/skills/lean-sdd-tdd/scripts/windows-runner.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
