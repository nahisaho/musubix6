name: Windows runner development controls

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-controls:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Run source native controls and literal-argv admission regressions
        run: node --test --test-reporter=spec .github/skills/lean-sdd-tdd/scripts/windows-native.test.mjs .github/skills/lean-sdd-tdd/scripts/windows-runner.test.mjs
      - name: Copy skills to both hosts
        shell: pwsh
        run: |
          node bin/musubix6.mjs init "$env:RUNNER_TEMP/runner-installed" --host both
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run relocated native controls for both hosts
        shell: pwsh
        run: |
          foreach ($hostDirectory in @(".github", ".claude")) {
            $env:SDD_SCRIPT_UNDER_TEST = "$env:RUNNER_TEMP/runner-installed/$hostDirectory/skills/lean-sdd-tdd/scripts/sdd.mjs"
            node --test --test-reporter=spec .github/skills/lean-sdd-tdd/scripts/windows-native.test.mjs .github/skills/lean-sdd-tdd/scripts/windows-runner.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run lone standalone script controls
        shell: pwsh
        run: |
          New-Item -ItemType Directory "$env:RUNNER_TEMP/runner-standalone" | Out-Null
          Copy-Item ".github/skills/lean-sdd-tdd/scripts/sdd.mjs" "$env:RUNNER_TEMP/runner-standalone/sdd.mjs"
          $env:SDD_SCRIPT_UNDER_TEST = "$env:RUNNER_TEMP/runner-standalone/sdd.mjs"
          node --test --test-reporter=spec .github/skills/lean-sdd-tdd/scripts/windows-native.test.mjs .github/skills/lean-sdd-tdd/scripts/windows-runner.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
